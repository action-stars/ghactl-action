name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  validate:
    name: Validate
    uses: action-stars/generic-workflows/.github/workflows/validate-gh-workflows.yaml@9ebbb6e9360565432fd1898fda091048be02db1b # v0.12.0
    with:
      auto_doc: true
      shellcheck: true
      yamlfmt: true
      rumdl: true

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - validate
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        version: ["latest", "0.0.11", "v0.0.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install ghactl
        uses: ./
        with:
          token: ${{ github.token }}
          version: ${{ matrix.version }}
      - name: Check
        run: |
          set -euo pipefail

          which ghactl
          ghactl --version
