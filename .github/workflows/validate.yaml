name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  validate:
    name: Validate
    uses: action-stars/generic-workflows/.github/workflows/validate-gh-workflows.yaml@436b5d8ebbc67151ec77f214d667d7393c3916af # v0.11.0
    with:
      auto_doc: true
      shellcheck: true
      yamlfmt: true
      rumdl: true

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - validate
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        version: ["latest", "0.0.4", "v0.0.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Install ghactl
        uses: ./
        with:
          token: ${{ github.token }}
          version: ${{ matrix.version }}
      - name: Check
        run: |
          set -euo pipefail

          which ghactl
          ghactl --version
